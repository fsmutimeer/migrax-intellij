name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**', 'refactor/**', 'chore/**', 'ci/**',
      'test/**', 'release/**', 'hotfix/**']
  pull_request:

permissions:
  contents: read

# A new push to a branch stops the run of the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # Unit tests and the plugin zip.
      - run: ./gradlew --no-daemon build buildPlugin

  verify:
    name: Plugin Verifier (all recommended IDE versions)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      # The verifier downloads every recommended IDE (several GB): free the runner's disk first.
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew --no-daemon verifyPlugin -PverifyAll
